version: '3.8'

services:
  backend:
    build: ./backend
    container_name: containerguard-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - BACKEND_PORT=3001
      - K8S_ENABLED=true
      - K8S_API_ENDPOINT=https://192.168.217.164:6443
      - DOCKER_ENABLED=true
      - DOCKER_SOCKET=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.kube:/root/.kube
    networks:
      - containerguard-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  dashboard:
    build: ./dashboard
    container_name: containerguard-dashboard
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - containerguard-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

networks:
  containerguard-net:
    driver: bridge
