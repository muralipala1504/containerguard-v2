version: '3.8'

services:
  backend:
    build: ./backend
    container_name: containerguard-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - BACKEND_PORT=3001
      - K8S_ENABLED=true
      - K8S_API_ENDPOINT=https://k3dserver:6443
      - DOCKER_ENABLED=true
      - DOCKER_SOCKET=/var/run/docker.sock
      - HOME=/root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.kube:/root/.kube:ro
    extra_hosts:
      - "k3dserver:192.168.217.164"
    networks:
      - containerguard-net

  dashboard:
    build: ./dashboard
    container_name: containerguard-dashboard
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - backend
    networks:
      - containerguard-net

networks:
  containerguard-net:
    driver: bridge
